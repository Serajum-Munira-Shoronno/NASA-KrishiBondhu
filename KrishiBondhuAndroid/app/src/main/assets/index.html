<style>

.divider{height:1px;background:var(--line);margin:13px 0}
.tabHead{font-size:22px;font-weight:800;margin:2px 0 4px}
.empty{padding:28px 15px;text-align:center;color:var(--muted)}.empty .ic{margin:0 auto 8px;color:var(--green)}.empty b{color:var(--ink)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:10;padding:6px 4px env(safe-area-inset-bottom)}
#nav{display:grid;grid-template-columns:repeat(5,1fr)}
.nav{background:transparent;color:#7d8d82;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-height:56px}
.navIco{padding:3px 14px;border-radius:14px;display:flex}

.hidden{display:none!important}

@keyframes spin{to{transform:rotate(360deg)}}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.dot.old{background:#b9d6c3}.dot.new{background:#1b7f45}.dot.low{background:#e0a93b}
.gibsCard{overflow:hidden}.gibsMap{position:relative;width:100%;aspect-ratio:3/2;min-height:220px;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#dcebd7,#b9d8c5);border:1px solid #d8e6dc;margin:12px 0}.gibsMap img{display:block;width:100%;height:100%;object-fit:cover}.gibsMapStatus{position:absolute;left:9px;top:9px;max-width:85%;padding:5px 9px;border-radius:14px;background:#fffffff0;color:#234b32;font-size:11px;font-weight:700;box-shadow:0 1px 6px #183b2526}.gibsMapStatus.error{color:#963a2c;background:#fff3f0}.gibsPin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50% 50% 50% 0;transform:translate(-50%,-78%) rotate(-45deg);background:#e34e3d;border:3px solid #fff;box-shadow:0 2px 9px #17342166}.gibsPin:after{content:'';position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;left:8px;top:8px}.gibsCross{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #163e2c66;pointer-events:none}.gibsCross:before,.gibsCross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #163e2c}.gibsCross:before{width:1px;height:64px;left:24px;top:-7px}.gibsCross:after{height:1px;width:64px;top:24px;left:-7px}.gibsLayers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.gibsLayer{padding:10px 5px;border-radius:13px;background:#f4f8f5;border:1.5px solid var(--line);color:var(--deep);font-size:11px;font-weight:800;min-height:66px}.gibsLayer .gibsEmoji{display:block;font-size:20px;margin-bottom:3px}.gibsLayer.active{background:#e5f4e9;border-color:#68a97a;box-shadow:inset 0 0 0 1px #68a97a}.gibsControls{display:grid;grid-template-columns:repeat(3,44px) 1fr repeat(2,44px);gap:6px;align-items:center;justify-content:center;margin:9px 0}.gibsControl{height:42px;border-radius:12px;background:#edf5ef;color:#165f36;font-weight:900;font-size:18px}.gibsControl:active,.gibsLayer:active{transform:scale(.95)}.gibsControl:disabled{opacity:.4}.gibsDate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}.gibsDate input{flex:1;min-width:145px;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 9px;color:var(--ink);background:#fff}.gibsDate .btn{min-height:40px;padding:8px 10px;font-size:11px}.gibsAttribution{font-size:10px;color:var(--muted);line-height:1.45;margin-top:8px}.gibsMapImgFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;color:#315c3d;font-size:13px;font-weight:700;background:linear-gradient(145deg,#e8f2e7,#c9e1d1)}.gibsMapImgFallback.hidden{display:none!important}@media(prefers-reduced-motion:no-preference){.gibsMap img{animation:gibsFade .35s ease}.gibsLayer,.gibsControl{transition:transform .12s ease,background .18s ease,border-color .18s ease}@keyframes gibsFade{from{opacity:.45}to{opacity:1}}}

/* Final release: tactile illustrated navigation and friendly motion */
@keyframes kbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes kbPulse{0%,100%{box-shadow:0 0 0 0 rgba(27,127,69,.14)}50%{box-shadow:0 0 0 7px rgba(27,127,69,0)}}
@keyframes kbShine{0%{transform:translateX(-140%) skewX(-18deg)}55%,100%{transform:translateX(220%) skewX(-18deg)}}
@keyframes kbPop{0%{transform:scale(.86);opacity:.35}100%{transform:scale(1);opacity:1}}
.tile{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile:active{transform:translateY(2px) scale(.97)}
.tileArt svg{animation:kbFloat 3.4s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(25,83,45,.09))}
.tile:nth-child(2n) .tileArt svg{animation-delay:-1.3s}
.tile:nth-child(3n) .tileArt svg{animation-delay:-2.1s}
.nav{position:relative;transition:color .18s ease,transform .18s ease}
.nav.active{transform:translateY(-2px)}
.nav.active .navIco{background:linear-gradient(145deg,#d8f0df,#eff9f1);box-shadow:inset 0 0 0 1px #cde5d3,0 4px 10px rgba(24,90,48,.08);animation:kbPop .22s ease-out}
.nav.active .navIco svg{animation:kbFloat 2.6s ease-in-out infinite}
.nav.active:after{content:'';position:absolute;bottom:0;width:18px;height:3px;border-radius:4px;background:#23834b}
.buttonGlyph{font-size:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.1));animation:kbFloat 2.4s ease-in-out infinite}
.btn{position:relative;overflow:hidden;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;box-shadow:0 3px 9px rgba(25,91,48,.12)}

function t(k,...a){const v=(L[lang]&&L[lang][k]!==undefined)?L[lang][k]:L.en[k];return typeof v==='function'?v(...a):(v===undefined?k:v)}

function dateStr(iso){try{return new Date(iso).toLocaleDateString(lang==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return String(iso||'').slice(0,10)}}
function hasCoords(){return farm.latitude!==''&&farm.longitude!==''&&isFinite(Number(farm.latitude))&&isFinite(Number(farm.longitude))}
function farmReady(){return !!(farm.name&&farm.location&&hasCoords())}
function backendBase(){const b=String(farm.backendUrl||DEFAULT_BACKEND||'').trim().replace(/\/+$/,'');return b.startsWith('https://')?b:''}
function persistFarm(){store.set('nexusFarm',farm)}
function dataReady(){return !!nasa&&(nasa.status==='live'||nasa.status==='cached')}

/* ===== NASA KrishiBondhu — on-device XEOI screening engine (same formulas as backend) ===== */
function clip(v,lo=0,hi=1){return Math.max(lo,Math.min(hi,v))}

function computeXeoi(sc){
  sc=sc||{rain:0,temp:0};
  if(!dataReady())return {status:'blocked',missing:['NASA POWER / SMAP / GPM']};
  let rain=num(nasa,'rainfallChangePct'),root=num(nasa,'smapRootZoneAnomalyPct'),temp=num(nasa,'temperatureMeanC');
  const missing=[];
  if(rain==null)missing.push('GPM rainfall comparison');
  if(root==null)missing.push('SMAP root-zone anomaly');
  if(temp==null)missing.push('NASA POWER temperature');
  if(missing.length)return {status:'blocked',missing};
  if(sc.rain){
    const recent=num(nasa,'rainfallRecent12mMm'),prior=num(nasa,'rainfallPrevious12mMm');
    if(recent!=null&&prior!=null)rain=((recent*(1+sc.rain/100)-prior)/Math.max(prior,1))*100;else rain+=sc.rain;
    root+=sc.rain*0.5;
  }
  temp+=sc.temp||0;
  const ancOK=!!ancillary&&(ancillary.status==='live'||ancillary.status==='cached');
  const ndviTrend=ancOK?num(ancillary.modis,'trendChangePct'):null;
  const etTrend=ancOK?num(ancillary.ecostress,'trendChangePct'):null;
  const five=ancOK&&ndviTrend!=null&&etTrend!=null;
  const rainDef=clip(Math.max(0,-rain)/50),soilDef=clip(Math.max(0,-root)/35);
  const etDecl=five?clip(Math.max(0,-etTrend)/35):0,vegDecl=five?clip(Math.max(0,-ndviTrend)/30):0;
  const waterDef=Math.max(rainDef,soilDef),etStress=etDecl*vegDecl*waterDef;
  const waterStress=0.38*rainDef+0.34*soilDef+0.16*etStress+0.12*vegDecl;
  const heat=clip((temp-28)/10);
  const p=String(farm.priority||'Balanced').toLowerCase();
  const wP=(p.includes('water')||p.includes('climate'))?1:(p.includes('balanced')?0.5:0);
  const sP=p.includes('soil')?1:(p.includes('balanced')?0.5:0);
  const wa=String(farm.water||'Unknown').toLowerCase();
  const wBonus=(wa==='limited'||wa==='rain-fed only')?0.12:0;
  const plausible=(v,min,max)=>v!=null&&v>=min&&v<=max?v:null;
  const om=plausible(num(farm,'organicMatter'),0,20);
  const n=plausible(num(farm,'nitrogen'),0,2);
  const ph=plausible(num(farm,'soilPh'),3,10);
  const pv=plausible(num(farm,'phosphorus'),0,500);
  const kv=plausible(num(farm,'potassium'),0,5);
  let soilNeed=0.30;
  if(om!=null&&om<1.5)soilNeed+=0.13;
  if(n!=null&&n<0.12)soilNeed+=0.12;
  if(pv!=null&&pv<(ph!=null&&ph<5.5?7:10))soilNeed+=0.10;
  if(kv!=null&&kv<0.12)soilNeed+=0.10;
  if(ph!=null&&(ph<5.5||ph>7.5))soilNeed+=0.09;
  if(String(farm.soilType||'Unknown')==='Unknown')soilNeed+=0.08;
  soilNeed=clip(soilNeed);
  const soilScore=clip(0.50+0.22*soilNeed+0.14*sP+0.08*vegDecl+0.06*(1-heat))*100;
  const waterScore=clip(0.48+0.28*waterStress+0.14*wP+wBonus+0.06*heat)*100;
  const sources=3+(five?2:0);
  return {status:'success',mode:five?5:3,sourcesUsed:sources,engineSource:'device',generatedAt:new Date().toISOString(),
    indices:{waterStress:Math.round(waterStress*1000)/10,heat:Math.round(heat*1000)/10,soilNeed:Math.round(soilNeed*1000)/10,vegDecline:Math.round(vegDecl*1000)/10},
    strategies:[{id:'existing',score:50},{id:'soil',score:Math.round(soilScore*10)/10},{id:'water',score:Math.round(waterScore*10)/10}]};
}
function sortedStrategies(res){return [...res.strategies].sort((a,b)=>b.score-a.score)}

/* ---- strategy content (bilingual, rule-based text) ---- */
function sequenceFor(id){
  const serverStrategy=(aiResult&&Array.isArray(aiResult.strategies))?aiResult.strategies.find(x=>x.id===id):null;
  if(serverStrategy&&Array.isArray(serverStrategy.sequence)&&serverStrategy.sequence.length)return serverStrategy.sequence;
  const cur=farm.currentCrop||'Rice';
  if(id==='existing'){
    const hist=String(farm.history||'').split(',').map(x=>x.trim()).filter(Boolean);
    return [cropName(cur),...hist].slice(0,4);
  }
  const s=SUG[cur]||SUG.Other;
  const mid=id==='soil'?s.soil:s.water;
  return [cropName(cur),cropName(mid),cropName(cur)];
}
function strategyText(id){return {name:t('st_'+id),tag:t('tg_'+id),why:t('why_'+id),ben:t('ben_'+id),risk:t('risk_'+id),bare:t('bare_'+id)}}

/* ---- evidence rows from the numbers the farmer can see ---- */
function evidenceRows(){
  const rows=[];
  rows.push({s:t('e_rain'),v:num(nasa,'rainfallChangePct')==null?null:fmt(nasa.rainfallChangePct,1)+'%',i:t('e_rain_i')});
  rows.push({s:t('e_soil'),v:num(nasa,'smapRootZoneAnomalyPct')==null?null:fmt(nasa.smapRootZoneAnomalyPct,1)+'%',i:t('e_soil_i')});
  rows.push({s:t('e_temp'),v:num(nasa,'temperatureMeanC')==null?null:fmt(nasa.temperatureMeanC,1)+'°C',i:t('e_temp_i')});
  const ok=ancillary&&ancillary.status==='live';
  const m=ok?num(ancillary.modis,'trendChangePct'):null,e=ok?num(ancillary.ecostress,'trendChangePct'):null;
  rows.push({s:t('e_ndvi'),v:m==null?null:fmt(m,1)+'%',i:t('e_ndvi_i')});
  rows.push({s:t('e_et'),v:e==null?null:fmt(e,1)+'%',i:t('e_et_i')});
  return rows;
}

/* ---- simple words for numbers ---- */
function soilWord(a){if(a==null)return '';return a<-25?t('w_vdry'):a<-8?t('w_dry'):a<=15?t('w_norm'):t('w_wet')}
function rainWord(p){if(p==null)return '';return p<-10?t('r_less'):p>10?t('r_more'):t('r_same')}

/* ---- offline assistant (rule-based; clearly labelled as offline) ---- */
function topStrategy(){if(!aiResult||!aiResult.strategies)return null;return sortedStrategies(aiResult)[0]}
function botReply(q){

  if(/next|rotation|which crop|what crop|plant|পরের|কোন ফসল|ফসল.*(লাগা|চাষ|ভালো)|পর্যায়|রোটেশন/i.test(s)){

      return tt(`আপনার তথ্য অনুযায়ী এখন "${nm}" সবচেয়ে মানানসই (তুলনামূলক স্কোর ${nd(Math.round(top.score))}/১০০)। উদাহরণ ক্রম: ${seq}। এটি ফলনের পূর্বাভাস নয়; বপনের সময়, জাত ও বাজার স্থানীয়ভাবে মিলিয়ে নিন।`,

function rainChart(){
  const arr=nasa&&Array.isArray(nasa.gpmMonthlyMm)?nasa.gpmMonthlyMm.map(Number):null;
  if(!arr||arr.length!==24||arr.some(v=>!isFinite(v)))return '';
  const first=String(nasa.gpmFirstMonth||'');const m0=/^\d{4}-\d{2}$/.test(first)?Number(first.slice(5,7))-1:null;
  const mn=lang==='bn'?['জানু','ফেব','মার্চ','এপ্রি','মে','জুন','জুলা','আগ','সেপ্টে','অক্টো','নভে','ডিসে']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const max=Math.max(1,...arr),top=Math.ceil(max/100)*100||100,H=110,W=340,x0=26,bw=10.2,gap=3.1;
  const sorted=[...arr].sort((a,b)=>a-b),low=sorted[5];
  let bars='',labels='';
  arr.forEach((v,i)=>{const h=Math.max(1,v/top*H),x=x0+i*(bw+gap),y=8+H-h;const isLow=v<=low;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" class="${isLow?'barLow':(i>=12?'barNew':'barOld')}"/>`;
    if(m0!=null&&i%3===0)labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${H+22}" text-anchor="middle" class="axl">${esc(mn[(m0+i)%12])}</text>`});
  const grid=[0,0.5,1].map(f=>`<line x1="${x0-4}" x2="${W-4}" y1="${(8+H-f*H).toFixed(1)}" y2="${(8+H-f*H).toFixed(1)}" class="gl"/><text x="${x0-7}" y="${(8+H-f*H+3).toFixed(1)}" text-anchor="end" class="axl">${nd(Math.round(top*f))}</text>`).join('');
  return `<div class="card"><div class="cardTitle">${esc(t('chart_title'))}</div>
  <svg viewBox="0 0 ${W} ${H+30}" width="100%" role="img" aria-label="${esc(t('chart_title'))}">${grid}${bars}${labels}</svg>
  <div class="legend"><span><i class="dot old"></i>${esc(tt('আগের ১২ মাস','Previous 12 mo'))}</span><span><i class="dot new"></i>${esc(tt('সাম্প্রতিক ১২ মাস','Latest 12 mo'))}</span><span><i class="dot low"></i>${esc(tt('সবচেয়ে কম বৃষ্টির মাস','Driest months'))}</span></div>
  <div class="muted" style="margin-top:8px">${esc(t('chart_note'))}</div></div>`;
}

/* ---- NASA GIBS imagery (visual context only; AppEEARS remains the numeric source) ---- */
const GIBS_LAYERS={
  trueColor:{id:'MODIS_Terra_CorrectedReflectance_TrueColor',format:'image/jpeg',label:'gibs_true',emoji:'🌍'},
  ndvi:{id:'MODIS_Terra_NDVI_8Day',format:'image/png',label:'gibs_ndvi',emoji:'🌿'},
  lst:{id:'MODIS_Terra_Land_Surface_Temp_Day',format:'image/png',label:'gibs_lst',emoji:'🌡️'}
};
function gibsCenter(){
  const lat=hasCoords()?Number(farm.latitude):23.81;
  const lon=hasCoords()?Number(farm.longitude):90.41;
  return {lat:clip(lat+gibs.panLat,-84,84),lon:((lon+gibs.panLon+540)%360)-180};
}
function gibsImageUrl(){
  const layer=GIBS_LAYERS[gibs.layer]||GIBS_LAYERS.trueColor;
  const c=gibsCenter(),scale=Math.pow(2,gibs.zoom);
  const halfLon=0.72/scale,halfLat=0.48/scale;
  const bbox=[c.lon-halfLon,c.lat-halfLat,c.lon+halfLon,c.lat+halfLat].map(v=>Number(v.toFixed(5))).join(',');
  const q=new URLSearchParams({SERVICE:'WMS',REQUEST:'GetMap',VERSION:'1.1.1',LAYERS:layer.id,STYLES:'',FORMAT:layer.format,TRANSPARENT:'FALSE',SRS:'EPSG:4326',BBOX:bbox,WIDTH:'900',HEIGHT:'600',TIME:gibs.date||'default'});
  return 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?'+q.toString();
}
function setGibsLayer(id){if(!GIBS_LAYERS[id])return;gibs.layer=id;refreshGibsImage()}
function setGibsDate(value){gibs.date=value||'default';refreshGibsImage()}
function resetGibsView(){gibs.zoom=0;gibs.panLat=0;gibs.panLon=0;refreshGibsImage()}
function gibsZoom(delta){gibs.zoom=clip(gibs.zoom+delta,0,5);refreshGibsImage()}
function gibsPan(dx,dy){const span=0.72/Math.pow(2,gibs.zoom);gibs.panLon+=dx*span*.28;gibs.panLat+=dy*span*.28;gibs.panLat=clip(gibs.panLat,-20,20);gibs.panLon=clip(gibs.panLon,-40,40);refreshGibsImage()}
function refreshGibsImage(){
  const img=$('gibsImage');if(!img)return;
  const status=$('gibsMapStatus'),fallback=$('gibsMapFallback');
  if(status){status.textContent=t('gibs_loading');status.classList.remove('error')}
  if(fallback)fallback.classList.add('hidden');
  gibs.loaded=false;img.src=gibsImageUrl();
  const date=$('gibsDateInput');if(date)date.value=gibs.date==='default'?'':gibs.date;
  const c=gibsCenter(),coords=$('gibsCoords');if(coords)coords.textContent=fmt(c.lat,4)+', '+fmt(c.lon,4);
}
function gibsImageLoaded(){
  gibs.loaded=true;const status=$('gibsMapStatus');if(status){status.textContent=t('gibs_loaded');status.classList.remove('error')}
  const fallback=$('gibsMapFallback');if(fallback)fallback.classList.add('hidden');
}
function gibsImageFailed(){
  const status=$('gibsMapStatus');if(status){status.textContent=t('gibs_failed');status.classList.add('error')}
  const fallback=$('gibsMapFallback');if(fallback){fallback.textContent=t('gibs_failed');fallback.classList.remove('hidden')}
}

function whatIfScores(){const r=computeXeoi(whatif);return r.status==='success'?r:null}
function scoreBlock(res){
  return sortedStrategies(res).map(s=>`<div class="srow"><div class="row"><b>${esc(t('st_'+s.id))}</b><b class="scoreSm">${fmt(s.score,0)}</b></div><div class="bar"><span style="width:${clip(s.score/100)*100}%"></span></div></div>`).join('');
}
function updateWhatIf(){
  whatif.rain=Number($('wi_rain').value);whatif.temp=Number($('wi_temp').value);
  $('wi_rain_v').textContent=(whatif.rain>0?'+':'')+nd(whatif.rain)+'%';$('wi_temp_v').textContent='+'+nd(whatif.temp.toFixed(1))+'°C';
  const r=whatIfScores();if(r)$('wi_scores').innerHTML=scoreBlock(r);
}
function resetWhatIf(){whatif={rain:0,temp:0};show('advice','whatif')}

function strategyCard(s,rank){
  const x=strategyText(s.id),seq=Array.isArray(s.sequence)&&s.sequence.length?s.sequence:sequenceFor(s.id),open=!!openDetail[s.id];
  const ev=evidenceRows().map(e=>`<li><b>${esc(e.s)}:</b> ${e.v==null?esc(t('e_na')):esc(e.v)}<br><span class="muted">${esc(e.i)}</span></li>`).join('');
  return `<div class="strategy ${rank===0?'best':''}">
   <div class="row"><span>${pill(x.tag)}${rank===0?' '+pill(t('a_best'),'gold'):''}</span><span class="score">${fmt(s.score,0)}<small>/${nd(100)}</small></span></div>
   <h3>${esc(x.name)}</h3><div class="bar"><span style="width:${clip(s.score/100)*100}%"></span></div>
   <div class="muted"><b>${esc(t('a_seq'))}</b></div>
   <div class="seq">${seq.map((c,i)=>`${i?'<span class="arrow">›</span>':''}<span class="crop">${esc(c)}</span>`).join('')}</div>

   <button class="btn secondary small" onclick="toggleDetail('${s.id}')">${esc(open?t('a_hide'):t('a_details'))}</button>
   ${open?`<div class="detail">
     <b>${esc(t('a_ben'))}</b><ul class="list">${x.ben.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
     <b>${esc(t('a_risk'))}</b><ul class="list">${x.risk.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
     <b>${esc(t('a_bare'))}</b><p class="muted" style="margin:4px 0 8px">${esc(x.bare)}</p>

function toggleDetail(id){openDetail[id]=!openDetail[id];adviceView(true)}
function aiGuidanceCard(g){
 if(!g)return '';
 const steps=Array.isArray(g.nextSteps)?g.nextSteps:[];
 const cautions=Array.isArray(g.cautions)?g.cautions:[];
 const sequence=Array.isArray(g.sequence)?g.sequence:[];
 const chosen=(aiResult?.strategies||[]).find(x=>x.id===g.recommendedPathwayId);
 const chosenName=chosen?strategyText(chosen.id).name:'';
 return `<section class="aiGuide"><h3>🌱 ${esc(g.heading||t('ai_pick'))}</h3>${chosenName?`<div class="pill">${esc(t('ai_path'))}: ${esc(chosenName)}</div>`:''}<p><b>${esc(t('ai_crop'))}:</b> ${esc(g.recommendedCrop||'—')}</p>${sequence.length?`<div class="seq">${sequence.map((x,i)=>`${i?'<span class=\"arrow\">→</span>':''}<span class=\"crop\">${esc(x)}</span>`).join('')}</div>`:''}<p>${esc(g.why||'')}</p>${steps.length?`<b>${esc(t('ai_steps'))}</b><ul>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${cautions.length?`<b>${esc(t('ai_care'))}</b><ul>${cautions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p class="smallText">${esc(g.validationNote||t('ai_validate'))}</p></section>`;
}
function cropEmoji(c){const s=String(c||'').toLowerCase();if(/rice|ধান/.test(s))return '🌾';if(/lentil|মসুর|mung|মুগ|soy|সয়াবিন/.test(s))return '🫘';if(/mustard|সরিষা/.test(s))return '🌼';if(/maize|corn|ভুট্টা/.test(s))return '🌽';if(/potato|আলু/.test(s))return '🥔';if(/wheat|গম/.test(s))return '🌾';return '🌱'}
function monthListLabel(arr){const names=lang==='bn'?['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (arr||[]).map(m=>names[Number(m)-1]||m).join(', ')}
function cropCandidateSection(){
 const list=aiResult&&Array.isArray(aiResult.cropCandidates)?aiResult.cropCandidates:[];
 if(!list.length)return '';
 const cards=list.slice(0,5).map(c=>{
   const name=lang==='bn'?(c.cropBn||c.crop):(c.crop||c.cropBn);
   const duration=Array.isArray(c.durationDays)?`${nd(c.durationDays[0])}–${nd(c.durationDays[1])} ${tt('দিন','days')}`:tt('জাতভেদে ভিন্ন','Variety dependent');
   const water=({low:tt('কম','Low'),low_to_medium:tt('কম-মাঝারি','Low–medium'),medium:tt('মাঝারি','Medium'),medium_to_high:tt('মাঝারি-বেশি','Medium–high'),high:tt('বেশি','High')})[c.waterNeed]||c.waterNeed;
   const score=Number(c.relativeFitScore)||0;
   const cautions=(c.cautions||[]).slice(0,2).map(x=>`<div class="smallText cautionLine">• ${esc(x)}</div>`).join('');
   const rootType=({shallow:tt('অগভীর','Shallow'),medium:tt('মাঝারি','Medium'),deep:tt('গভীর','Deep'),taproot:tt('প্রধান শিকড়','Taproot'),fibrous:tt('গুচ্ছ শিকড়','Fibrous')})[c.rootType]||c.rootType||'—';
   const source=(c.sources||[])[0];
   return `<div class="cropCandidate"><div class="cropEmoji">${cropEmoji(name)}</div><div><h3>${esc(name)}</h3><div class="meta"><span class="factorPill">${esc(t('a_family'))}: ${esc(c.family||'—')}</span><span class="factorPill">${esc(t('a_waterneed'))}: ${esc(water)}</span><span class="factorPill">${esc(t('a_root'))}: ${esc(rootType)}</span></div><div class="meta"><span>${esc(t('a_months'))}: ${esc(monthListLabel(c.plantingMonths))}</span><span>· ${esc(t('a_duration'))}: ${esc(duration)}</span></div><div class="row"><span class="smallText">${esc(t('a_fit'))}</span><b>${fmt(score,0)}/100</b></div><div class="fitbar"><span style="width:${Math.max(0,Math.min(100,score))}%"></span></div><div class="details">${esc(c.explanation||'')}</div>${cautions}${source?`<a class="barcLink" href="${esc(source)}" target="_blank" rel="noopener">${esc(tt('উৎস দেখুন','View source'))} ↗</a>`:''}</div></div>`;
 }).join('');
 const cal=aiResult.cropCalendar||{},screen=cal.soilTestScreen||{},flags=screen.flags||[];
 const flagLabels={low_organic_matter:tt('জৈব পদার্থ কম','Low organic matter'),low_total_nitrogen_screen:tt('মোট নাইট্রোজেন কম','Low total N screen'),low_available_phosphorus_screen:tt('উপলব্ধ ফসফরাস কম','Low available P screen'),low_exchangeable_potassium_screen:tt('বিনিমেয় পটাশিয়াম কম','Low exchangeable K screen')};
 const invalidLabels={soilPh:tt('pH একক/মান যাচাই','Check pH value/unit'),organicMatterPct:tt('জৈব পদার্থের মান যাচাই','Check organic matter value'),totalNitrogenPct:tt('N % একক যাচাই','Check N % unit'),availablePhosphorusMgKg:tt('P mg/kg একক যাচাই','Check P mg/kg unit'),exchangeablePotassiumCmolKg:tt('K cmol(+)/kg একক যাচাই','Check K cmol(+)/kg unit')};
 const invalid=screen.invalidFields||[];
 const flagHtml=[...flags.map(f=>`<span class="soilFlag">${esc(flagLabels[f]||f)}</span>`),...invalid.map(f=>`<span class="soilFlag invalid">⚠ ${esc(invalidLabels[f]||f)}</span>`)].join('')||`<span class="smallText">${esc(tt('কোনো soil-test flag পাওয়া যায়নি বা পরীক্ষা দেওয়া হয়নি।','No soil-test flag recorded; lab data may be missing.'))}</span>`;
 return `<div class="sectionTitle"><h2>🌱 ${esc(t('a_candidates'))}</h2></div><p class="smallText">${esc(t('a_candidate_note'))}</p>${cards}<div class="card"><b>${esc(t('a_soilcheck'))}</b><div style="margin-top:5px">${flagHtml}</div><div class="smallText" style="margin-top:8px">${esc(screen.interpretation||'')}</div></div><div class="barcPanel"><b>🗺️ ${esc(t('a_barc'))}</b><div class="smallText" style="margin-top:4px">${esc(t('a_barc_note'))}</div><a class="barcLink" href="https://portal.cropzoning.gov.bd/cropSuitability" target="_blank" rel="noopener">${esc(tt('সরকারি BARC Crop Suitability খুলুন','Open official BARC Crop Suitability'))} ↗</a></div>`;
}

function adviceView(keepScroll){
  const y=window.scrollY;
  const ready=dataReady();
  let body='';
  if(!ready){
    body=`<div class="empty">${ico('globe',40)}<b>${esc(t('a_need'))}</b><p class="muted">${esc(t('a_need2'))}</p><button class="btn" onclick="show('sat')">${esc(t('cta_data'))}</button></div>`;
  }else{
    const advancedReady=!!ancillary&&['live','cached'].includes(ancillary.status)&&ancillary.modis?.status==='live'&&ancillary.ecostress?.status==='live';
    const serverReady=!!backendBase();
    if(!advancedReady)body+=`<div class="note">🛰️ ${esc(t('adv_needed'))}<button class="btn secondary small" style="width:100%;margin-top:9px" onclick="show('sat')">${esc(t('go_sat'))}</button></div>`;
    else if(!serverReady)body+=`<div class="note">⚙️ ${esc(t('backend_needed'))}<button class="btn secondary small" style="width:100%;margin-top:9px" onclick="openSettings()">${esc(t('go_backend'))}</button></div>`;
    body+=`<button class="btn big" style="width:100%" id="genBtn" onclick="generatePlan()" ${busy.plan||!advancedReady||!serverReady?'disabled':''}>${busy.plan?`<span class="busy"></span> ${esc(t('a_working'))}`:`<span class="buttonGlyph">🌱</span> ${esc(aiResult?t('a_regen'):t('a_gen'))}`}</button>`;
    if(aiResult&&aiResult.strategies){
      const n=aiResult.sourcesUsed||5;
      body+=`<div class="card mint"><div class="row"><b>${esc(t('a_src',nd(n)))}</b>${pill(n>=5?'5/5':nd(n)+'/'+nd(5),n>=5?'':'warn')}</div><div class="muted" style="margin-top:6px">${esc(n>=5?t('a_note5'):t('a_note3'))}</div></div>`;
      body+=aiGuidanceCard(aiResult.aiGuidance);
      body+=cropCandidateSection();
      body+=sortedStrategies(aiResult).map((s,i)=>strategyCard(s,i)).join('');
      body+=`<div class="smallText">${esc(t('a_score_note'))}</div>`;
    }
    body+=whatIfCard();
    if(aiResult&&aiResult.strategies)body+=`<button class="btn ghost" style="width:100%;margin-top:10px" onclick="show('compare')">${esc(t('t_compare'))}</button>`;
  }
  setView(`<div class="tabHead">${esc(t('a_title'))}</div><p class="muted">${esc(t('a_intro'))}</p>${body}<div class="info">${esc(t('a_local'))}</div>`);
  if(keepScroll===true)window.scrollTo(0,y);
}

  <div id="chatBox" class="chatBox">${msgs.map((m,i)=>bubble(m,i)).join('')}${busy.chat?'<div class="msg bot"><div class="bub typing"><i></i><i></i><i></i></div></div>':''}</div>
  <div class="chips" style="margin:10px 0">${t('chips').map((c,i)=>`<button class="chip" onclick="sendChip(${i})">${esc(c)}</button>`).join('')}</div>
  <div class="chatInput"><input id="chatIn" placeholder="${esc(t('chat_ph'))}" onkeydown="if(event.key==='Enter')sendChat()"><button class="sendBtn voiceBtn" onclick="startVoice()" aria-label="${esc(t('chat_voice'))}">${ico('mic',21)}</button><button class="sendBtn" onclick="sendChat()" aria-label="${esc(t('chat_send'))}">${ico('send',20)}</button></div>
  <div class="voiceHint">🎙️ ${esc(t('chat_voice'))}</div>
  <div class="smallText" style="margin-top:8px">${esc(t('chat_warn'))}</div>`);
  const b=$('chatBox');if(b)b.scrollTop=b.scrollHeight;
}
function clearChat(){chat=[];store.del('nexusChat');askView()}
function sendChip(i){const c=t('chips')[i];if(c)submitChat(c)}
function sendChat(){const el=$('chatIn');const q=(el.value||'').trim();if(!q)return;el.value='';submitChat(q)}
function startVoice(){
 if(!needNative('startVoiceInput'))return;
 const id='voice_'+Date.now();
 window.onVoiceResult=function(cid,raw){if(cid!==id)return;let r={};try{r=JSON.parse(raw)}catch(e){}if(r.text){const input=$('chatIn');if(input){input.value=r.text;input.focus()}else submitChat(r.text)}else if(r.error)toast(r.error,'warn')};
 NexusNative.startVoiceInput(JSON.stringify({callbackId:id,language:lang==='bn'?'bn-BD':'en-US'}));
}
function speakText(text){if(!needNative('speakText'))return;NexusNative.speakText(JSON.stringify({text:String(text||'').slice(0,2500),language:lang==='bn'?'bn-BD':'en-US'}))}
function speakChat(i){const item=chat[i];if(item&&item.role==='bot')speakText(item.text)}

/* ---- Settings ---- */
function openSettings(){
  openSheet(t('set_title'),`
   <div class="field"><label>${esc(t('set_lang'))}</label><div class="seg"><button class="${lang==='bn'?'on':''}" onclick="closeSheet();setLang('bn')">বাংলা</button><button class="${lang==='en'?'on':''}" onclick="closeSheet();setLang('en')">English</button></div></div>
   <div class="divider"></div>
   <div class="field"><label>${esc(t('set_backend'))}</label><input id="s_backend" value="${esc(farm.backendUrl||'')}" placeholder="https://your-service.onrender.com" inputmode="url" autocapitalize="off"></div>
   <div class="smallText">${esc(t('set_backend_help'))}</div>
   <button class="btn secondary" style="width:100%;margin-top:10px" onclick="saveBackendUrl()">${esc(t('set_saveurl'))}</button>
   <button class="btn ghost" id="verifyBtn" style="width:100%;margin-top:8px" onclick="verifyBackend()">${esc(t('set_verify'))}</button>
   <div class="divider"></div>

/* ===== NASA KrishiBondhu — data flows (NASA, AppEEARS, XEOI, chat, settings) ===== */
function needNative(fn){if(!window.NexusNative||!NexusNative[fn]){toast(t('need_native'),'warn');return false}return true}

function fetchNasa(){
  if(!hasCoords()){toast(t('s_need_coord'),'warn');show('farm');return}
  if(!needNative('fetchNasa'))return;
  busy.nasa=true;if(current==='sat')satView();
  const id='cb_'+Date.now();
  window.onNasaResult=function(cid,txt){
    if(cid!==id)return;busy.nasa=false;
    try{
      const r=JSON.parse(txt);
      if(r.status!=='live')throw new Error(r.message||'NASA data retrieval failed');
      nasa=r;store.set('nexusLiveNasa',nasa);aiResult=null;store.del('nexusAIResult');
      toast(t('s_ok'));
    }catch(e){toast(t('s_fail')+': '+e.message+' — '+t('s_fail2'),'err')}
    if(current==='sat')satView();
  };
  NexusNative.fetchNasa(JSON.stringify({latitude:Number(farm.latitude),longitude:Number(farm.longitude),callbackId:id}));
}

function fetchAdvanced(){
  const base=backendBase();
  if(!base){toast(t('adv_need'),'warn');return}
  if(!hasCoords()){toast(t('s_need_coord'),'warn');show('farm');return}
  if(!needNative('submitAncillary'))return;
  busy.adv=true;if(current==='sat')satView();
  const id='app_'+Date.now();let taskId=null,attempt=0;
  const finish=(msg,kind)=>{busy.adv=false;if(msg)toast(msg,kind);if(current==='sat')satView()};
  const poll=()=>{
    if(attempt++>60){finish(t('adv_timeout'),'warn');return}
    setTimeout(()=>NexusNative.checkAncillary(JSON.stringify({backendUrl:base,taskId:taskId,callbackId:id})),8000);
  };
  window.onAncillarySubmitResult=function(cid,txt){
    if(cid!==id)return;
    try{const r=JSON.parse(txt);if(r.status!=='submitted')throw new Error(r.message||'AppEEARS task was not submitted');taskId=r.taskId;toast(t('adv_sent'));poll()}
    catch(e){finish(e.message,'err')}
  };
  window.onAncillaryResult=function(cid,txt){
    if(cid!==id)return;
    let r;try{r=JSON.parse(txt)}catch(e){finish('Invalid AppEEARS response','err');return}
    if(r.status==='live'){ancillary=r;store.set('nexusAncillary',ancillary);aiResult=null;store.del('nexusAIResult');finish(t('adv_ok'));return}
    if(r.status==='partial'||r.status==='error'){ancillary=r.status==='partial'?r:ancillary;if(r.status==='partial')store.set('nexusAncillary',ancillary);finish((t('adv_partial'))+(r.message?': '+r.message:''),'warn');return}
    if(r.status==='done'){finish(t('adv_partial'),'warn');return}
    poll();
  };
  NexusNative.submitAncillary(JSON.stringify({backendUrl:base,latitude:Number(farm.latitude),longitude:Number(farm.longitude),months:24,callbackId:id}));
}

function backendDecision(){
  return new Promise((resolve,reject)=>{
    if(!window.NexusNative||!NexusNative.runAiDecision){reject(new Error('no bridge'));return}
    const id='ai_'+Date.now();
    const timer=setTimeout(()=>reject(new Error('timeout')),105000);
    window.onAiDecisionResult=function(cid,txt){
      if(cid!==id)return;clearTimeout(timer);
      try{const r=JSON.parse(txt);if(r.status!=='success'||!Array.isArray(r.strategies)||r.strategies.length<3)throw new Error(r.message||'bad result');resolve(r)}
      catch(e){reject(e)}
    };
    const f={...farm};delete f.backendUrl;
    NexusNative.runAiDecision(JSON.stringify({backendUrl:backendBase(),farm:f,nasa:nasa,ancillary:ancillary,lang:lang,callbackId:id}));
  });
}

async function generatePlan(){
  if(!dataReady()){toast(t('a_need'),'warn');show('sat');return}
  if(!ancillary||!['live','cached'].includes(ancillary.status)){
    toast(t('a_need5'),'warn');show('sat');return;
  }
  if(!backendBase()){
    toast(t('a_need_backend'),'warn');openSettings();return;
  }
  busy.plan=true;adviceView(true);
  try{
    const r=await backendDecision();
    if(r.status!=='success'||!Array.isArray(r.strategies)||r.strategies.length!==3||!r.aiGuidance)throw new Error(r.message||'AI decision response was incomplete');
    aiResult={...r,mode:5,sourcesUsed:5,engineSource:'server',releaseVersion:'2026.11'};
    store.set('nexusAIResult',aiResult);
    toast(t('a_done'));show('advice');
  }catch(e){
    toast(t('a_gen_fail')+': '+String(e.message||e).slice(0,150),'err');
  }finally{
    busy.plan=false;
    if(current==='advice')adviceView(true);
  }
}

/* ---- chat: real AI via team backend when available, otherwise offline assistant ---- */
function chatContext(){
  const f={...farm};delete f.backendUrl;
  const n={};['temperatureMeanC','rainfallRecent12mMm','rainfallChangePct','smapRootZoneAnomalyPct','heatDays35C','frostDays0C','smapRootZoneMoistureM3m3'].forEach(k=>{if(nasa&&nasa[k]!=null)n[k]=nasa[k]});
  const compactSensor=(o)=>o?{status:o.status,product:o.product,observationCount:o.observationCount,mean:o.mean,trendChangePct:o.trendChangePct,firstDate:o.firstDate,latestDate:o.latestDate,qualityObservationsAccepted:o.qualityObservationsAccepted,qualityObservationsSeen:o.qualityObservationsSeen,unit:o.unit}:null;
  return {farm:f,nasa:n,ancillary:ancillary?{status:ancillary.status,modis:compactSensor(ancillary.modis),ecostress:compactSensor(ancillary.ecostress)}:{},plan:aiResult?{strategies:aiResult.strategies,aiGuidance:aiResult.aiGuidance}:{},cropCandidates:aiResult&&Array.isArray(aiResult.cropCandidates)?aiResult.cropCandidates:[],lang:lang};
}
async function askServer(){
  const base=backendBase();if(!base)throw new Error('no backend');
  const msgs=chat.filter(m=>m.role==='user'||m.role==='bot').slice(-8).map(m=>({role:m.role==='bot'?'assistant':'user',content:String(m.text).slice(0,1900)}));
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),45000);
  try{
    const resp=await fetch(base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,...chatContext()}),signal:ctl.signal});
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok||!data.reply)throw new Error(data.detail||('HTTP '+resp.status));
    return String(data.reply);
  }finally{clearTimeout(to)}
}
async function submitChat(q){
  if(busy.chat)return;
  chat.push({role:'user',text:q});busy.chat=true;if(current==='ask')askView();
  let reply,note='';
  if(chatMode()){
    try{reply=await askServer()}
    catch(e){chatServerFailAt=Date.now();reply=botReply(q);note=t('chat_off_note')}
  }else{reply=botReply(q)}
  chat.push({role:'bot',text:reply,note:note});chat=chat.slice(-30);store.set('nexusChat',chat);
  busy.chat=false;if(current==='ask')askView();
}

/* ---- settings actions ---- */
function saveBackendUrl(){
  const v=($('s_backend').value||'').trim().replace(/\/+$/,'');
  if(v&&!v.startsWith('https://')){toast(t('set_url_bad'),'warn');return}
  farm.backendUrl=v;persistFarm();chatServerFailAt=0;toast(t('set_url_saved'));
}
function verifyBackend(){
  const base=($('s_backend').value||'').trim().replace(/\/+$/,'');
  if(!base.startsWith('https://')){toast(t('set_url_bad'),'warn');return}
  if(!needNative('verifyBackend'))return;
  const id='verify_'+Date.now(),btn=$('verifyBtn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="busy dark"></span> '+esc(t('set_verifying'))}
  window.onBackendVerifyResult=function(cid,txt){
    if(cid!==id)return;
    if(btn){btn.disabled=false;btn.textContent=t('set_verify')}
    try{const r=JSON.parse(txt);if(r.status!=='verified')throw new Error(r.message||'not verified');toast(t('set_verified')+' · '+t(r.aiConfigured?'set_ai_ready':'set_ai_missing')+' · MODIS '+r.modis.product+' · ECOSTRESS '+r.ecostress.product,r.aiConfigured?'':'warn')}
    catch(e){toast(t('set_verify_fail')+': '+e.message,'err')}
  };
  NexusNative.verifyBackend(JSON.stringify({backendUrl:base,callbackId:id}));
}
function clearAll(){
  openSheet(t('set_clear'),`<p class="muted" style="font-size:14px">${esc(t('set_confirm'))}</p><button class="btn danger" style="width:100%;margin-top:8px" onclick="doClearAll()">${esc(t('set_clear'))}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">${esc(t('cancel'))}</button>`);
}
function doClearAll(){
  ['nexusFarm','nexusLiveNasa','nexusAncillary','nexusAIResult','nexusPlans','nexusChat'].forEach(k=>store.del(k));
  farm={...defaultFarm};nasa=null;ancillary=null;aiResult=null;chat=[];whatif={rain:0,temp:0};
  closeSheet();toast(t('set_cleared'));show('home');
}

/* ---- start ---- */
renderChrome();show('home');

/* ---- 2-second launch splash: Earth turning in space ---- */
(function(){
  const sp=document.getElementById('splash');if(!sp)return;
  let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  let s='';for(let i=0;i<48;i++)s+=`<i style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;animation-delay:${(rnd()*1.7).toFixed(2)}s;transform:scale(${(0.6+rnd()*1.2).toFixed(2)})"></i>`;
  $('stars').innerHTML=s;$('sTag').textContent=tt('মহাকাশের তথ্য থেকে মাঠের সিদ্ধান্ত','From space data to field decisions');
  let done=false;const close=()=>{if(done)return;done=true;sp.classList.add('out');try{if(window.NexusNative&&NexusNative.splashDone)NexusNative.splashDone()}catch(e){}setTimeout(()=>sp.remove(),460)};
  sp.addEventListener('click',close);setTimeout(close,2000);
})();
