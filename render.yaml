
services:
  - type: web
    name: krishibondhu-earth-observation-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NASA_EARTHDATA_USERNAME
        sync: false
      - key: NASA_EARTHDATA_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: claude-sonnet-5-5
      - key: NEXUS_DB_PATH
        value: /tmp/krishibondhu_tasks.sqlite3
